<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Louvores</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="player-area" aria-label="Player de louvores">
      <div class="header">
        <div>
          <h1 class="title">Meus Louvores</h1>
          <p class="subtitle">
            Player com embeds individuais do EasyMusic para navegar entre os louvores pelo site.
          </p>
        </div>

        <div class="counter" aria-label="Total de louvores">
          <strong id="totalMusics">0</strong>
          louvores
        </div>
      </div>

      <div class="now-playing">
        <small>Tocando agora</small>
        <h2 id="currentTitle">Nenhum louvor selecionado</h2>
      </div>

      <div class="iframe-box" id="iframeBox">
        <div class="empty-player">
          Escolha um louvor na biblioteca ou aperte Play para carregar a primeira faixa.
        </div>
      </div>

    </section>

    <aside class="library" aria-label="Biblioteca de louvores">
      <h2>Biblioteca</h2>
      <div class="music-list" id="musicList"></div>
    </aside>
  </main>

  <footer class="controls" aria-label="Controles do player">
    <div class="progress-row">
      <span id="currentTime" class="time-label">0:00</span>
      <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0" step="0.1" aria-label="Progresso da musica" />
      <span id="durationTime" class="time-label">0:00</span>
    </div>

    <div class="control-row">
      <button type="button" class="control-btn skip-btn" onclick="previousTrack()" aria-label="Faixa anterior" title="Anterior">
        <span class="control-icon">⏮</span>
      </button>
      <button type="button" id="playPauseBtn" class="control-btn main-btn" onclick="togglePlay()" aria-label="Tocar" title="Tocar">
        <span class="control-icon">▶</span>
      </button>
      <button type="button" class="control-btn skip-btn" onclick="nextTrack()" aria-label="Proxima faixa" title="Proxima">
        <span class="control-icon">⏭</span>
      </button>
      <button type="button" id="shuffleBtn" class="control-btn mode-btn" onclick="toggleShuffle()" aria-label="Aleatorio" title="Aleatorio">
        <span class="control-icon">
          <svg class="shuffle-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h12" />
            <path d="M13 5l3 3-3 3" />
            <path d="M4 16h12" />
            <path d="M13 13l3 3-3 3" />
          </svg>
        </span>
        <span class="control-label">Aleatorio</span>
      </button>
      <button type="button" id="repeatBtn" class="control-btn mode-btn" onclick="toggleRepeat()" aria-label="Repetir todas" title="Repetir: Todas">
        <span class="control-icon">↻</span>
        <span class="control-label">Todas</span>
      </button>

      <div class="volume-control" aria-label="Controle de volume">
        <span class="volume-icon">Vol</span>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Volume" />
        <button type="button" id="turboBtn" class="control-btn turbo-btn" onclick="toggleTurboGain()" aria-pressed="false" aria-label="Turbo gain desligado" title="Turbo Gain">
          Turbo
        </button>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
